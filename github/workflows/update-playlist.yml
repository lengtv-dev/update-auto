name: Update M3U Playlist Every 4 Hours

on:
  schedule:
    # รันอัตโนมัติทุกๆ 4 ชั่วโมง (ใช้ UTC Time)
    - cron: '0 */4 * * *'
  workflow_dispatch: # ปุ่มสำหรับกดรันเองผ่านหน้าเว็บ GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Playlist Generation Script
      run: python build_playlist.py

    - name: Commit and Push Updated Playlist
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist.m3u [skip ci]" && git push)
        
